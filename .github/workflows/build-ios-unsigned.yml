name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - cmp-rewrite   # Byg automatisk ved hvert push til hovedbranchen
  workflow_dispatch:  # Kan også køres manuelt fra Actions-fanen

permissions:
  contents: write     # Nødvendig for at kunne oprette/opdatere GitHub Releases

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Vælg nyeste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules (skip ødelagte)
        run: git submodule update --init --recursive 2>/dev/null || git submodule update --init MPVKit 2>/dev/null || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Opret local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Giv rettigheder til scripts
        run: |
          chmod +x gradlew
          find scripts -name "*.sh" -exec chmod +x {} \;

      - name: Byg Kotlin/Native iOS framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Byg unsigned .app via xcodebuild
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build/iosOutput"

      - name: Pak .app ind i .ipa
        run: |
          mkdir -p build/Payload
          APP=$(find build/iosOutput -name "*.app" -maxdepth 1 | head -1)
          echo "Fundet app: $APP"
          cp -r "$APP" build/Payload/
          cd build
          zip -r NuvioMobile-unsigned.ipa Payload
          echo "IPA størrelse: $(du -sh NuvioMobile-unsigned.ipa)"

      - name: Upload IPA som artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-iOS-unsigned
          path: build/NuvioMobile-unsigned.ipa
          retention-days: 14

      - name: Udgiv IPA til GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Seneste iOS build (unsigned)
          body: |
            Automatisk bygget unsigned IPA fra seneste commit på `cmp-rewrite`.

            - Commit: ${{ github.sha }}
            - Bygget: ${{ github.run_id }}
          prerelease: true
          files: build/NuvioMobile-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
