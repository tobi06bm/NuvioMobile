name: Build iOS IPA (Unsigned)

# Bygger en ny IPA når jeg selv pusher til cmp-rewrite.
# Automatisk synk fra originalen håndteres af sync-upstream-build.yml.

on:
  push:
    branches:
      - cmp-rewrite   # Byg automatisk ved hvert push til hovedbranchen
    paths-ignore:
      - '**/*.md'     # Ren dokumentation udløser ikke et helt iOS-byg
      - 'docs/**'
      - 'Docs/**'
  workflow_dispatch:  # Kan også køres manuelt fra Actions-fanen

permissions:
  contents: write     # Nødvendig for at kunne oprette/opdatere GitHub Releases

concurrency:
  group: build-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    uses: ./.github/workflows/build-ipa.yml
    with:
      ref: ${{ github.sha }}
      reason: Push til cmp-rewrite
    permissions:
      contents: write
