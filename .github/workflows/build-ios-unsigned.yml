name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:  # Kør manuelt fra Actions-fanen

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Vælg nyeste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules (skip ødelagte)
        run: git submodule update --init --recursive 2>/dev/null || git submodule update --init MPVKit

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Opret local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Giv rettigheder til scripts
        run: |
          chmod +x gradlew
          find scripts -name "*.sh" -exec chmod +x {} \;

      - name: Byg Kotlin/Native iOS framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Byg unsigned .app via xcodebuild
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build/iosOutput"

      - name: Pak .app ind i .ipa
        run: |
          mkdir -p build/Payload
          APP=$(find build/iosOutput -name "*.app" -maxdepth 1 | head -1)
          echo "Fundet app: $APP"
          cp -r "$APP" build/Payload/
          cd build
          zip -r NuvioMobile-unsigned.ipa Payload
          echo "IPA størrelse: $(du -sh NuvioMobile-unsigned.ipa)"

      - name: Upload IPA som artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-iOS-unsigned
          path: build/NuvioMobile-unsigned.ipa
          retention-days: 14
