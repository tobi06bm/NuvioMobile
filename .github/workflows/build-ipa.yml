name: Byg iOS IPA (genbrugelig)

# Denne workflow starter ikke af sig selv – den kaldes af de andre workflows
# (build-ios-unsigned.yml og sync-upstream-build.yml), så selve byg-opskriften
# kun står ét sted.

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch eller commit der skal bygges"
        required: false
        type: string
        default: cmp-rewrite
      reason:
        description: "Kort tekst der forklarer hvorfor bygget kørte (vises i release)"
        required: false
        type: string
        default: "Automatisk build"

permissions:
  contents: write     # Nødvendig for at kunne oprette/opdatere GitHub Releases

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Vælg nyeste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Læs app-version
        id: version
        # Versionen står i den samme fil som både Android og iOS bygger ud fra,
        # så releasen får altid det rigtige versionsnummer med.
        run: |
          FILE=iosApp/Configuration/Version.xcconfig
          NAME=$(grep -m1 '^MARKETING_VERSION=' "$FILE" | cut -d= -f2 | tr -d ' \r')
          CODE=$(grep -m1 '^CURRENT_PROJECT_VERSION=' "$FILE" | cut -d= -f2 | tr -d ' \r')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-$CODE" >> "$GITHUB_OUTPUT"
          echo "Bygger version $NAME ($CODE)"

      - name: Hent MPVKit-afspilleren
        # Submodul-pinnet peger på en commit der ikke længere findes i kilde-repoet,
        # så vi henter den nyeste fungerende version direkte ind i MPVKit-mappen.
        run: |
          rm -rf MPVKit
          git clone --depth 1 https://github.com/tapframe/MPVNuvio.git MPVKit

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Opret local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Giv rettigheder til scripts
        run: |
          chmod +x gradlew
          find scripts -name "*.sh" -exec chmod +x {} \;

      - name: Byg unsigned .app via xcodebuild
        # xcodebuild kører selv Kotlin/Native-bygget (embedAndSign) som et build-trin.
        # Vi bygger Debug i stedet for Release: Release-optimeringen af Kotlin/Native
        # bruger 8-12 GB RAM og løber tør på den gratis 7 GB-server. Debug springer
        # optimeringen over, passer let i hukommelsen og giver stadig en app der virker.
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build/iosOutput"

      - name: Pak .app ind i .ipa
        run: |
          mkdir -p build/Payload
          APP=$(find build/iosOutput -name "*.app" -maxdepth 1 | head -1)
          echo "Fundet app: $APP"
          cp -r "$APP" build/Payload/
          cd build
          zip -r NuvioMobile-unsigned.ipa Payload
          echo "IPA størrelse: $(du -sh NuvioMobile-unsigned.ipa)"

      - name: Upload IPA som artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-iOS-unsigned
          path: build/NuvioMobile-unsigned.ipa
          retention-days: 14

      - name: Udgiv IPA til rullende "seneste build"-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          target_commitish: ${{ inputs.ref }}
          name: Seneste iOS build (unsigned)
          body: |
            Automatisk bygget unsigned IPA – altid den nyeste kode.

            - Version: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            - Årsag: ${{ inputs.reason }}
            - Commit: ${{ github.sha }}
            - Build: ${{ github.run_id }}
          prerelease: true
          files: build/NuvioMobile-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Udgiv IPA til versions-release
        # Ud over den rullende release får hver app-version sin egen release,
        # så man kan hente en bestemt version igen senere.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ inputs.ref }}
          name: NuvioMobile ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) – unsigned IPA
          body: |
            Unsigned IPA af NuvioMobile ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }}).

            - Årsag: ${{ inputs.reason }}
            - Commit: ${{ github.sha }}
            - Build: ${{ github.run_id }}
          prerelease: true
          files: build/NuvioMobile-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
