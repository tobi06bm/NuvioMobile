name: Synk fra original + Byg iOS IPA

# Holder min fork opdateret med originalen (NuvioMedia/NuvioMobile) og bygger
# automatisk en ny unsigned IPA hver gang der er nye ændringer derovre.
# Kører af sig selv hver 6. time – ingen manuelle skridt.

on:
  schedule:
    - cron: '0 */6 * * *'   # Tjek originalen for nyt hver 6. time
  workflow_dispatch:        # Kan også startes manuelt fra Actions-fanen

permissions:
  contents: write           # Nødvendig for at pushe synk + oprette Release
  issues: write             # Nødvendig for at kunne melde fejl som en issue

concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

jobs:
  # 1) Hent nye ændringer fra originalen og flet dem ind i min fork
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout min fork
        uses: actions/checkout@v4
        with:
          ref: cmp-rewrite
          fetch-depth: 0

      - name: Flet originalens ændringer ind
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch upstream cmp-rewrite

          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/cmp-rewrite; then
            # Mine workflow-filer er med vilje anderledes end originalens, så de
            # støder sammen hver gang originalen retter i sine. Den slags konflikt
            # løser vi selv (vi beholder altid mine). Alt ANDET der støder sammen
            # er rigtig kode og skal ses efter i hånden.
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Filer i konflikt:"
            echo "$CONFLICTS"

            if echo "$CONFLICTS" | grep -qv '^\.github/workflows/'; then
              git merge --abort || true
              echo "::error::Merge-konflikt i rigtige kodefiler mellem min fork og originalen – kan ikke flette automatisk. Ret konflikten i hånden og kør workflowet igen."
              exit 1
            fi

            echo "Kun workflow-filer er i konflikt – beholder mine egne og fortsætter."
            echo "$CONFLICTS" | while read -r f; do
              [ -n "$f" ] || continue
              # --ours virker ikke hvis JEG har slettet filen; så fjerner vi den bare.
              git checkout --ours -- "$f" 2>/dev/null || git rm -q -- "$f"
            done
            git add -A .github/workflows
            git commit --no-edit
          fi

          # GitHubs robot-token har ikke lov til at oprette/ændre workflow-filer
          # (.github/workflows/*). Hvis originalen rører en workflow, bliver
          # pushet ellers afvist. Vi nulstiller derfor hele workflow-mappen til
          # præcis vores egen udgave: først slettes mappen (så filer originalen
          # har TILFØJET også ryger med), derefter hentes vores egne filer tilbage.
          if ! git diff --quiet "$BEFORE" HEAD -- .github/workflows; then
            echo "Originalen ændrede workflow-filer – beholder mine egne."
            git rm -r -q --ignore-unmatch .github/workflows
            git checkout "$BEFORE" -- .github/workflows
            git commit -m "Behold egne workflows ved synk fra original" || true
          fi

          # Sikkerhedsnet: hvis workflow-mappen stadig afviger fra vores egen,
          # bliver pushet afvist af GitHub. Stop hellere her med en tydelig fejl.
          if ! git diff --quiet "$BEFORE" HEAD -- .github/workflows; then
            echo "::error::.github/workflows afviger stadig fra min egen udgave – pushet ville blive afvist af GitHub."
            exit 1
          fi

          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Ingen nye ændringer fra originalen – springer byg over."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nye ændringer fundet – opdaterer min fork."
            git push origin cmp-rewrite
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 2) Byg ny IPA – kun hvis der faktisk var nye ændringer.
  #    Selve bygget er defineret ét sted: build-ios-unsigned.yml
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/build-ios-unsigned.yml
    permissions:
      contents: write
    with:
      ref: cmp-rewrite
      distribution: full

  # 3) Sig til hvis automatikken går i stå, så den ikke dør i stilhed
  meld-fejl:
    needs: [sync, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Opret issue om fejlet automatik
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- nuvio-bot:sync-failure -->";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Kun én åben issue ad gangen – ellers kommer der en ny hver 6. time.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "automation",
              per_page: 100,
            });

            const existing = open.find(issue => (issue.body || "").includes(marker));

            if (existing) {
              core.info(`Issue #${existing.number} er allerede åben – opretter ikke en ny.`);
              return;
            }

            const body =
              `${marker}\n` +
              `Den automatiske synk fra originalen (eller iOS-bygget bagefter) fejlede.\n\n` +
              `- Kørsel: ${runUrl}\n\n` +
              `Typiske årsager:\n` +
              `- Merge-konflikt mellem forken og \`NuvioMedia/NuvioMobile\` (skal rettes i hånden)\n` +
              `- Bygget fejlede på macOS-serveren\n\n` +
              `Automatikken prøver igen ved næste planlagte kørsel. ` +
              `Luk denne issue når problemet er løst – så oprettes der en ny hvis det sker igen.`;

            const created = await github.rest.issues.create({
              owner,
              repo,
              title: "Automatisk synk/byg fejlede",
              body,
              labels: ["automation"],
            });

            core.info(`Oprettede issue #${created.data.number}.`);
