name: Synk fra original + Byg iOS IPA

# Holder min fork opdateret med originalen (NuvioMedia/NuvioMobile) og bygger
# automatisk en ny unsigned IPA hver gang der er nye ændringer derovre.
# Kører helt af sig selv efter en fast tidsplan – ingen manuel start nødvendig.

on:
  schedule:
    - cron: '0 */3 * * *'   # Tjekker originalen for nye ændringer hver 3. time (UTC)
  workflow_dispatch:        # Kan også startes manuelt fra Actions-fanen
    inputs:
      force_build:
        description: "Byg en ny IPA selvom der ikke er nye ændringer fra originalen"
        type: boolean
        required: false
        default: false

permissions:
  contents: write           # Nødvendig for at pushe synk + oprette Release

concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

jobs:
  # 1) Hent nye ændringer fra originalen og flet dem ind i min fork
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout min fork
        uses: actions/checkout@v4
        with:
          ref: cmp-rewrite
          fetch-depth: 0

      - name: Flet originalens ændringer ind
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch upstream cmp-rewrite

          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/cmp-rewrite; then
            git merge --abort || true
            echo "::error::Merge-konflikt mellem min fork og originalen – kan ikke flette automatisk."
            exit 1
          fi

          # GitHubs robot-token har ikke lov til at oprette/ændre workflow-filer
          # (.github/workflows/*). Hvis originalen ændrer en workflow, bliver
          # pushet ellers afvist. Vi beholder derfor altid VORES egne
          # workflow-filer og ruller originalens workflow-ændringer tilbage,
          # så pushet ikke rører .github/workflows.
          if ! git diff --quiet "$BEFORE" HEAD -- .github/workflows; then
            echo "Originalen ændrede workflow-filer – beholder mine egne."
            git checkout "$BEFORE" -- .github/workflows
            git commit -m "Behold egne workflows ved synk fra original" || true
          fi

          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Ingen nye ændringer fra originalen – springer byg over."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nye ændringer fundet – opdaterer min fork."
            git push origin cmp-rewrite
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 2) Byg ny IPA – kun hvis der faktisk var nye ændringer (eller hvis man selv
  #    beder om det ved manuel start). Selve byg-opskriften ligger i build-ipa.yml.
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event.inputs.force_build == 'true'
    uses: ./.github/workflows/build-ipa.yml
    with:
      ref: cmp-rewrite
      reason: Synk fra originalen (NuvioMedia/NuvioMobile)
    permissions:
      contents: write

  # 3) Sig til hvis automatikken går i stå, så det ikke fejler i stilhed.
  #    Opretter ét issue – og genbruger det samme issue hvis det sker igen.
  meld-fejl:
    needs: [sync, build]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Opret eller opdater fejl-issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automatisk synk/byg fejlede';
            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Den automatiske synk fra originalen eller det efterfølgende IPA-byg fejlede.',
              '',
              `- Kørsel: ${link}`,
              `- Synk: ${{ needs.sync.result }}`,
              `- Byg: ${{ needs.build.result }}`,
              '',
              'Typisk årsag: merge-konflikt mellem forken og originalen. Så skal konflikten løses manuelt én gang, hvorefter automatikken kører videre selv.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find(i => i.title === title && !i.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
