<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuvio – Download til iPhone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 2rem;
    }

    .logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #6c3ce1, #a855f7);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 32px rgba(108, 60, 225, 0.4);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #6c3ce1, #a855f7);
      color: #fff;
      text-decoration: none;
      padding: 1rem 2.2rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(108, 60, 225, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(108, 60, 225, 0.65);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .note {
      margin-top: 1.8rem;
      font-size: 0.82rem;
      color: #555;
      text-align: center;
      max-width: 340px;
      line-height: 1.6;
    }

    .version-badge {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: #444;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="logo">📺</div>

  <h1>Nuvio</h1>
  <p class="subtitle">Streaming til iPhone &amp; iPad</p>

  <a
    class="download-btn"
    href="https://github.com/tobi06bm/NuvioMobile/releases/download/ios-latest/NuvioMobile-unsigned.ipa"
    download
  >
    ⬇ Download til iPhone
  </a>

  <p class="note">
    Filen er en <strong>.ipa</strong>-fil og kræver et sideloading-program
    som <strong>AltStore</strong> eller <strong>Sideloadly</strong> for at
    installere den på din iPhone.
  </p>

  <p class="version-badge">Opdateres automatisk med seneste version</p>

</body>
</html>
